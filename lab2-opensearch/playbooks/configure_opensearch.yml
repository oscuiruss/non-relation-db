---
- name: Configure the secured OpenSearch hot-warm cluster
  hosts: opensearch_nodes
  become: true
  gather_facts: false

  pre_tasks:
    - name: Check locally generated TLS files
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../files/pki/{{ item }}"
      loop:
        - root-ca.pem
        - admin.pem
        - admin-key.pem
        - os-hot.pem
        - os-hot-key.pem
        - os-warm.pem
        - os-warm-key.pem
      register: opensearch_local_tls_files
      delegate_to: localhost
      become: false
      run_once: true

    - name: Verify that all required TLS files exist
      ansible.builtin.assert:
        that:
          - item.stat.exists
        fail_msg: >-
          Missing {{ item.item }}. Run scripts/generate_certs.sh before this playbook.
      loop: "{{ opensearch_local_tls_files.results }}"
      loop_control:
        label: "{{ item.item }}"
      delegate_to: localhost
      become: false
      run_once: true

  tasks:
    - name: Create the OpenSearch certificate directory
      ansible.builtin.file:
        path: /etc/opensearch/certs
        state: directory
        owner: root
        group: opensearch
        mode: "0750"

    - name: Install the root CA certificate
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/pki/root-ca.pem"
        dest: /etc/opensearch/certs/root-ca.pem
        owner: root
        group: opensearch
        mode: "0644"
      notify: Restart OpenSearch

    - name: Install the node certificate
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/pki/{{ inventory_hostname }}.pem"
        dest: "/etc/opensearch/certs/{{ inventory_hostname }}.pem"
        owner: root
        group: opensearch
        mode: "0644"
      notify: Restart OpenSearch

    - name: Install the node private key
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/pki/{{ inventory_hostname }}-key.pem"
        dest: "/etc/opensearch/certs/{{ inventory_hostname }}-key.pem"
        owner: root
        group: opensearch
        mode: "0640"
      notify: Restart OpenSearch

    - name: Install the admin certificate on the hot node
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/pki/{{ item }}"
        dest: "/etc/opensearch/certs/{{ item }}"
        owner: root
        group: opensearch
        mode: "{{ '0640' if item.endswith('-key.pem') else '0644' }}"
      loop:
        - admin.pem
        - admin-key.pem
      when: inventory_hostname == 'os-hot'

    - name: Configure the OpenSearch node and TLS settings
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/opensearch.yml.j2"
        dest: /etc/opensearch/opensearch.yml
        owner: root
        group: opensearch
        mode: "0640"
        backup: true
      notify: Restart OpenSearch

    - name: Set the initial JVM heap size
      ansible.builtin.lineinfile:
        path: /etc/opensearch/jvm.options
        regexp: '^-Xms'
        line: "-Xms{{ opensearch_heap_size }}"
        backup: true
      notify: Restart OpenSearch

    - name: Set the maximum JVM heap size
      ansible.builtin.lineinfile:
        path: /etc/opensearch/jvm.options
        regexp: '^-Xmx'
        line: "-Xmx{{ opensearch_heap_size }}"
        backup: true
      notify: Restart OpenSearch

    - name: Remove demo internal users before Security plugin initialization
      ansible.builtin.copy:
        dest: /etc/opensearch/opensearch-security/internal_users.yml
        owner: root
        group: opensearch
        mode: "0640"
        backup: true
        content: |
          ---
          _meta:
            type: "internalusers"
            config_version: 2
      when: inventory_hostname == 'os-hot'

    - name: Apply configuration and start both OpenSearch nodes
      ansible.builtin.meta: flush_handlers

    - name: Wait for the HTTPS port
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: 9200
        delay: 2
        timeout: 120

    - name: Check whether the Security plugin was already initialized
      ansible.builtin.stat:
        path: /etc/opensearch/.security-initialized
      register: opensearch_security_marker
      run_once: true
      delegate_to: os-hot

    - name: Initialize the Security plugin configuration
      ansible.builtin.command:
        argv:
          - /usr/share/opensearch/plugins/opensearch-security/tools/securityadmin.sh
          - -cd
          - /etc/opensearch/opensearch-security
          - -cn
          - "{{ opensearch_cluster_name }}"
          - -h
          - 127.0.0.1
          - -p
          - "9200"
          - -cacert
          - /etc/opensearch/certs/root-ca.pem
          - -cert
          - /etc/opensearch/certs/admin.pem
          - -key
          - /etc/opensearch/certs/admin-key.pem
      environment:
        OPENSEARCH_JAVA_HOME: /usr/share/opensearch/jdk
      register: opensearch_securityadmin
      run_once: true
      delegate_to: os-hot
      when: not opensearch_security_marker.stat.exists
      changed_when: true

    - name: Mark the Security plugin as initialized
      ansible.builtin.file:
        path: /etc/opensearch/.security-initialized
        state: touch
        owner: root
        group: opensearch
        mode: "0640"
      run_once: true
      delegate_to: os-hot
      when:
        - not opensearch_security_marker.stat.exists
        - (opensearch_securityadmin.rc | default(1)) == 0

    - name: Read the secured cluster health
      ansible.builtin.command:
        argv:
          - curl
          - --fail
          - --silent
          - --show-error
          - --cacert
          - /etc/opensearch/certs/root-ca.pem
          - --cert
          - /etc/opensearch/certs/admin.pem
          - --key
          - /etc/opensearch/certs/admin-key.pem
          - https://127.0.0.1:9200/_cluster/health?pretty
      register: opensearch_cluster_health
      changed_when: false
      run_once: true
      delegate_to: os-hot

    - name: Show the secured cluster health
      ansible.builtin.debug:
        var: opensearch_cluster_health.stdout
      run_once: true

  handlers:
    - name: Restart OpenSearch
      ansible.builtin.systemd_service:
        name: opensearch
        enabled: true
        state: restarted
