global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: loyalty-app
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8000"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
