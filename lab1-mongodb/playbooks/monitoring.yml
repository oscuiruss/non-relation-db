---
- name: Install MongoDB monitoring stack
  hosts: mongodb
  become: true
  gather_facts: false

  vars:
    mongodb_exporter_version: "0.53.0"

  handlers:
    - name: Restart MongoDB exporter
      ansible.builtin.systemd_service:
        name: mongodb-exporter
        state: restarted
        daemon_reload: true

    - name: Restart Prometheus
      ansible.builtin.systemd_service:
        name: prometheus
        state: restarted

    - name: Restart Grafana
      ansible.builtin.systemd_service:
        name: grafana-server
        state: restarted

  tasks:
    - name: Require monitoring secret
      ansible.builtin.assert:
        that:
          - vault_monitoring_password | length >= 12
        fail_msg: Set a strong monitoring password in the encrypted vault.
      no_log: true

    - name: Detect Debian package architecture
      ansible.builtin.command: dpkg --print-architecture
      register: monitoring_deb_arch
      changed_when: false

    - name: Select exporter release architecture
      ansible.builtin.set_fact:
        mongodb_exporter_arch: "{{ {'arm64': 'arm64', 'amd64': 'amd64'}[monitoring_deb_arch.stdout] }}"

    - name: Create exporter system account
      ansible.builtin.user:
        name: mongodb-exporter
        system: true
        create_home: false
        shell: /usr/sbin/nologin

    - name: Download MongoDB exporter
      ansible.builtin.get_url:
        url: >-
          https://github.com/percona/mongodb_exporter/releases/download/v{{ mongodb_exporter_version }}/mongodb_exporter-{{ mongodb_exporter_version }}.linux-{{ mongodb_exporter_arch }}.tar.gz
        dest: "/tmp/mongodb_exporter-{{ mongodb_exporter_version }}.tar.gz"
        mode: "0644"

    - name: Create exporter extraction directory
      ansible.builtin.file:
        path: "/tmp/mongodb_exporter-{{ mongodb_exporter_version }}"
        state: directory
        mode: "0755"

    - name: Extract MongoDB exporter
      ansible.builtin.unarchive:
        src: "/tmp/mongodb_exporter-{{ mongodb_exporter_version }}.tar.gz"
        dest: "/tmp/mongodb_exporter-{{ mongodb_exporter_version }}"
        remote_src: true

    - name: Locate exporter binary
      ansible.builtin.find:
        paths: "/tmp/mongodb_exporter-{{ mongodb_exporter_version }}"
        patterns: mongodb_exporter
        file_type: file
        recurse: true
      register: mongodb_exporter_binary

    - name: Verify exporter binary was extracted
      ansible.builtin.assert:
        that: mongodb_exporter_binary.matched == 1
        fail_msg: MongoDB exporter archive did not contain exactly one binary.

    - name: Install exporter binary
      ansible.builtin.copy:
        src: "{{ mongodb_exporter_binary.files[0].path }}"
        dest: /usr/local/bin/mongodb_exporter
        remote_src: true
        owner: root
        group: root
        mode: "0755"
      notify: Restart MongoDB exporter

    - name: Create exporter configuration directory
      ansible.builtin.file:
        path: /etc/mongodb-exporter
        state: directory
        owner: root
        group: mongodb-exporter
        mode: "0750"

    - name: Install protected exporter credentials
      ansible.builtin.copy:
        content: |
          MONGODB_USER=mongodb_exporter
          MONGODB_PASSWORD={{ vault_monitoring_password | to_json }}
        dest: /etc/mongodb-exporter/mongodb-exporter.env
        owner: root
        group: mongodb-exporter
        mode: "0640"
      notify: Restart MongoDB exporter
      no_log: true

    - name: Install exporter systemd unit
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../config/mongodb-exporter.service"
        dest: /etc/systemd/system/mongodb-exporter.service
        owner: root
        group: root
        mode: "0644"
      notify: Restart MongoDB exporter

    - name: Install Prometheus
      ansible.builtin.apt:
        name: prometheus
        state: present
        update_cache: true

    - name: Bind Prometheus web interface to localhost
      ansible.builtin.lineinfile:
        path: /etc/default/prometheus
        regexp: '^ARGS='
        line: 'ARGS="--web.listen-address=127.0.0.1:9090"'
        create: true
        mode: "0644"
      notify: Restart Prometheus

    - name: Install Prometheus scrape configuration
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../config/prometheus.yml"
        dest: /etc/prometheus/prometheus.yml
        owner: root
        group: root
        mode: "0644"
        validate: /usr/bin/promtool check config %s
      notify: Restart Prometheus

    - name: Ensure apt keyring directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Download Grafana signing key
      ansible.builtin.get_url:
        url: https://apt.grafana.com/gpg-full.key
        dest: /etc/apt/keyrings/grafana.asc
        mode: "0644"

    - name: Add Grafana apt repository
      ansible.builtin.deb822_repository:
        name: grafana
        types:
          - deb
        uris:
          - https://apt.grafana.com
        suites:
          - stable
        components:
          - main
        signed_by: /etc/apt/keyrings/grafana.asc
        state: present

    - name: Install Grafana
      ansible.builtin.apt:
        name: grafana
        state: present
        update_cache: true

    - name: Create Grafana provisioning directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "0755"
      loop:
        - { path: /etc/grafana/provisioning/datasources, owner: root, group: grafana }
        - { path: /etc/grafana/provisioning/dashboards, owner: root, group: grafana }
        - { path: /var/lib/grafana/dashboards, owner: grafana, group: grafana }

    - name: Install Grafana provisioning files
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: grafana
        mode: "0644"
      loop:
        - src: "{{ playbook_dir }}/../config/grafana/provisioning/datasources/prometheus.yml"
          dest: /etc/grafana/provisioning/datasources/prometheus.yml
        - src: "{{ playbook_dir }}/../config/grafana/provisioning/dashboards/mongodb.yml"
          dest: /etc/grafana/provisioning/dashboards/mongodb.yml
      notify: Restart Grafana

    - name: Install MongoDB Grafana dashboard
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../config/grafana/dashboards/mongodb-lab.json"
        dest: /var/lib/grafana/dashboards/mongodb-lab.json
        owner: grafana
        group: grafana
        mode: "0644"
      notify: Restart Grafana

    - name: Enable monitoring services
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
        daemon_reload: true
      loop:
        - mongodb-exporter
        - prometheus
        - grafana-server

    - name: Apply pending service restarts
      ansible.builtin.meta: flush_handlers

    - name: Check monitoring endpoints
      ansible.builtin.uri:
        url: "{{ item }}"
        status_code: 200
      loop:
        - http://127.0.0.1:9216/metrics
        - http://127.0.0.1:9090/-/ready
        - http://127.0.0.1:3000/api/health

    - name: Verify exporter can reach MongoDB
      ansible.builtin.shell: |
        set -o pipefail
        curl --fail --silent http://127.0.0.1:9216/metrics | grep -E '^mongodb_up 1$'
      args:
        executable: /bin/bash
      changed_when: false
